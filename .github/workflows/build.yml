# Compilazione automatica a ogni push, in un container Arch Linux (le
# versioni di wlroots e Qt che usa Vela sono quelle di Arch).
#
# - build: tutto il progetto, strumenti di prova compresi, e le prove
#   (ctest): quelle del compositor (FrameClock, geometria, colore...), di
#   Esplora, dei .desktop e delle app predefinite. Le prove funzionali e di
#   nitidezza (tests/functional) qui risultano saltate: il renderer vuole una
#   GPU con un nodo DRM, che i runner di GitHub non hanno.
# - package: solo per main, il pacchetto vela-git costruito con il
#   PKGBUILD, scaricabile dalla pagina dell'esecuzione (Artifacts) e
#   installabile con sudo pacman -U.

name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Un push nuovo sullo stesso ramo ferma la compilazione precedente.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEPENDENCIES: >-
    base-devel git cmake ccache shaderc vulkan-headers vulkan-icd-loader gtest python
    wayland wayland-protocols wlroots0.20 libxkbcommon pixman libinput libdrm
    mesa freetype2 harfbuzz fontconfig librsvg cairo zlib pam
    qt6-base qt6-declarative qt6-svg qt6-wayland qt6-tools layer-shell-qt
    hicolor-icon-theme

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Dependencies
        run: pacman -Syu --noconfirm --needed $DEPENDENCIES

      - uses: actions/checkout@v7

      - name: ccache cache
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-${{ github.sha }}
          restore-keys: ccache-

      - name: Configure
        run: >-
          cmake -B build -S .
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DVELA_BUILD_TOOLS=ON

      - name: Build
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_MAXSIZE: 500M
        run: |
          cmake --build build -j "$(nproc)"
          ccache --show-stats

      - name: Tests
        run: ctest --test-dir build --output-on-failure

      - name: Scripts
        run: |
          for script in packaging/arch/vela-update session/vela-session-env scripts/*.sh; do
            sh -n "$script"
          done

  package:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Dependencies
        run: pacman -Syu --noconfirm --needed $DEPENDENCIES

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # la versione del pacchetto conta i commit

      # makepkg non gira come root: un utente apposta, che prende Vela da
      # questa copia del repository.
      - name: Package
        run: |
          useradd -m builder
          cp -r packaging/arch /home/builder/pkgbuild
          chown -R builder /home/builder/pkgbuild
          git config --system --add safe.directory '*'
          # Niente pacchetto -debug: raddoppia il tempo e pesa dieci volte tanto.
          sed -i '/^OPTIONS=/s/\([( ]\)debug\b/\1!debug/' /etc/makepkg.conf
          cd /home/builder/pkgbuild
          su builder -c "VELA_GIT_URL=file://$GITHUB_WORKSPACE MAKEFLAGS=-j$(nproc) makepkg --noconfirm"

      - uses: actions/upload-artifact@v7
        with:
          name: vela-git
          path: /home/builder/pkgbuild/vela-git-[0-9]*.pkg.tar.zst
          retention-days: 14
