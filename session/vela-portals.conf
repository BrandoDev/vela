# I portali per le app dentro Vela (selettore file, apri con, impostazioni,
# condivisione dello schermo). Quelli di KDE funzionano fuori da Plasma;
# catture e condivisione dello schermo passano da xdg-desktop-portal-wlr,
# che usa i protocolli di cattura standard supportati da Vela.
[preferred]
default=kde;gtk
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
